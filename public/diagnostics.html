<!doctype html>
<html lang="ja">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>検出モデルの動作確認</title>
<style>body{font:16px sans-serif;max-width:750px;margin:60px auto;padding:20px;background:#191320;color:#eee}button{padding:14px;font:inherit}pre{white-space:pre-wrap;line-height:1.8}a{color:#ffbc72}</style>
<h1>検出モデルの動作確認</h1>
<p>カメラを使わず、白紙の画像で顔・手・グー／パーの検出処理が起動するか確認します。</p>
<p><label><input id="face-only" type="checkbox"> マウス投げ用（顔だけを検出）</label></p>
<button id="run">確認をはじめる</button><pre id="result" role="status">未実行</pre>
<p><a href="./">体験画面へ</a></p>
<script type="module">
const button = document.getElementById('run'), result = document.getElementById('result');
button.addEventListener('click', () => {
  button.disabled = true; result.textContent = 'モデルを読み込み中…';
  const worker = new Worker('./tracker-worker.js?v=20261024-gesture');
  let state;
  const names = { 'face-landmarker':'顔検出', 'gesture-recognizer':'グー／パー＋手の検出', 'hand-landmarker':'手の検出（代替モデル）', unavailable:'利用不可', disabled:'省略（マウス用）' };
  const description = data => `顔: ${names[data.faceEngine] || data.faceEngine}\n手: ${names[data.handEngine] || data.handEngine}`;
  const finish = text => { result.textContent = text; worker.terminate(); button.disabled = false; clearTimeout(timer); };
  const timer = setTimeout(() => finish('失敗: 検出処理が60秒以内に応答しませんでした。'), 60000);
  worker.onerror = e => finish(`失敗: ${e.message}`);
  worker.onmessage = async ({data}) => {
    if (data.type === 'ready') {
      state = data;
      result.textContent = `${description(data)}\n白紙画像を検出中…`;
      const blank = document.createElement('canvas'); blank.width = 640; blank.height = 480;
      const ctx = blank.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, 640, 480);
      const bitmap = await createImageBitmap(blank);
      worker.postMessage({type:'frame', bitmap, time:performance.now()}, [bitmap]);
    } else if (data.type === 'result') {
      state = { ...state, ...data };
      const complete = state.faceEngine === 'face-landmarker' && (state.handEngine === 'gesture-recognizer' || state.handEngine === 'disabled');
      const errors = [state.faceError && `顔のエラー: ${state.faceError}`, state.handError && `手のエラー: ${state.handError}`, state.handWarning && `ジェスチャーモデル: ${state.handWarning}`].filter(Boolean);
      finish(`${complete ? '成功' : '一部の検出が利用できません'}\n${description(state)}\n検出結果: 顔 ${data.faces.length}人 / 手 ${data.hands.length}本（白紙なので両方0が正常）\n${errors.join('\n')}\n実際の顔や手の認識精度は、体験画面で確認してください。`);
    } else if (data.type === 'status') {
      state = { ...state, ...data };
    } else if (data.type === 'error') finish(`失敗: ${data.message}`);
  };
  worker.postMessage({type:'init', detectHands:!document.getElementById('face-only').checked});
});
</script>
</html>
